services:
  fl-scam-api:
    build: .
    container_name: ${SERVER_CONTAINER_NAME:-fl-scam-api}
    command: uvicorn server_api:app --host 0.0.0.0 --port 8000
    environment:
      NUM_CLIENTS: ${NUM_CLIENTS:-2}
      N_ROUNDS: ${N_ROUNDS:-10}
      INPUT_DIM: ${INPUT_DIM:-10}
      PRETRAIN_EPOCHS: ${PRETRAIN_EPOCHS:-0}
      PRETRAIN_DATA_PATH: ${PRETRAIN_DATA_PATH:-data/test_data.csv}
    ports:
      - "${SERVER_PORT:-8000}:8000"
    volumes:
      - ./checkpoints:/app/checkpoints
      - ./data:/app/data
